name: CI

# Pull-request gate only. Nightly and stable/release verification live in
# nightly.yml and stable.yml; they are never invoked here.
# Budget: 10 min including checkout, dependency install, commitlint, and verify:pr
# (the measured verify:pr budget itself is 2 min).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify commit messages
        env:
          COMMITLINT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMITLINT_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$COMMITLINT_FROM^{commit}" 2>/dev/null; then
            pnpm commitlint --from "$COMMITLINT_FROM" --to "$COMMITLINT_TO" --verbose
          else
            pnpm commitlint --last --verbose
          fi

      - name: Verify pull request
        run: pnpm verify:pr
