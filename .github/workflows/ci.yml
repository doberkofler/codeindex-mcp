name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify commit messages
        env:
          COMMITLINT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMITLINT_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$COMMITLINT_FROM^{commit}" 2>/dev/null; then
            pnpm commitlint --from "$COMMITLINT_FROM" --to "$COMMITLINT_TO" --verbose
          else
            pnpm commitlint --last --verbose
          fi

      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      - name: Verify references
        run: pnpm verify:references
        env:
          CODE_INDEX_ROOT: .
          CODE_INDEX_PROJECT_FILE: tsconfig.json
          CODE_INDEX_LOG_LEVEL: error
