name: Release

# Trigger: immutable version tag.
# Stable verification runs first on the declared GitHub-hosted runner.
# Budget: 375 min total; stable job 360 min, publish job 15 min.
# Artifact retention: stable evidence 90 days; the release job uploads nothing.
# Failure meaning: Deterministic system or Performance gate for stable checks;
# release packaging for the final publish step. See .github/workflows/README.md.

# Named explicitly so the tag run is distinguishable from the `main` CI run on the
# same commit, which otherwise shares the release commit subject.
run-name: Release (${{ github.ref_name }})

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  stable:
    name: Stable verification
    uses: ./.github/workflows/stable.yml
    permissions:
      contents: read
      actions: read

  release:
    name: Publish GitHub release
    needs: stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # `secrets` is not an allowed context in a step-level `if`; expose it as
      # job environment so the optional publish step can test it.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, pack, and smoke-test release artifacts
        run: |
          pnpm run test:packages
          node scripts/packRelease.mjs

      - name: Publish packages in dependency order
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          pnpm --filter @codeindex/adapter-sdk publish --access public --no-git-checks --tag next
          pnpm --filter @codeindex/adapter-typescript publish --access public --no-git-checks --tag next
          pnpm --filter @codeindex/adapter-oracle publish --access public --no-git-checks --tag next
          pnpm --filter codeindex-mcp publish --access public --no-git-checks --tag next

      - name: Create GitHub release and attach artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.tgz
