name: Release

# Trigger: immutable version tag.
# Stable verification runs first on the declared GitHub-hosted runner.
# Budget: 375 min total; stable job 360 min, publish job 15 min.
# Artifact retention: stable evidence 90 days; the release job uploads nothing.
# Failure meaning: Deterministic system or Performance gate for stable checks;
# release packaging for the final publish step. See .github/workflows/README.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  stable:
    name: Stable verification
    uses: ./.github/workflows/stable.yml
    permissions:
      contents: read
      actions: read

  release:
    name: Publish GitHub release
    needs: stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
